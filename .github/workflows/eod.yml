name: eod

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 18:30 IST, after the close and late filings
  workflow_dispatch:

concurrency:
  group: eod
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FINN_MODEL_CHEAP: ${{ vars.FINN_MODEL_CHEAP }}
      FINN_MODEL_STRONG: ${{ vars.FINN_MODEL_STRONG }}
      FINN_EMBED_MODEL: ${{ vars.FINN_EMBED_MODEL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: pip install -e .
      - name: Prices and signals
        run: python -m finn_worker.cli ingest-eod --backfill-days 3
      - name: Late filings
        run: python -m finn_worker.cli ingest-filings
      - name: Push pending alerts
        run: python -m finn_worker.cli push
