[project]
name = "finn-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "yfinance>=0.2.50",
  "pandas>=2.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pymupdf>=1.24",
  "tenacity>=8.3",
  "psycopg[binary]>=3.2",
  "rapidfuzz>=3.9",
  "bse>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["finn_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
